[project]
name = "xatu-analysis"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "clickhouse-connect>=1.0.1",
    "kaleido>=1.3.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "plotly>=6.7.0",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
